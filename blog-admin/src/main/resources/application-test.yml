# Server settings
server:
    tomcat:
        basedir: /var/tmp/oneblog/blog-admin
# SPRING PROFILES
spring:
    profiles:
        include: [center]

# logging settings
logging:
    config: classpath:logback-spring.xml
    file:
      path: /var/tmp/oneblog/logs
    level:
      root: INFO
      com.zyd: INFO

####################################自定义配置##########################################
app:
    # 测试环境关闭验证码（方便自动化测试）
    enableKaptcha: ${ONEBLOG_APP_ENABLE_KAPTCHA:false}
    # 测试环境不自动检查友情链接
    enableAutoCheckLink: ${ONEBLOG_APP_ENABLE_CHECK_LINK:false}
    # 测试环境不打印配置信息
    enabledPrintConfig: ${ONEBLOG_APP_ENABLE_PRINT_CONFIG:false}
    # 测试环境关闭 redis 缓存
    enableRedisCache: ${ONEBLOG_ENABLE_REDIS_CACHE:false}
    # shiro配置项
    shiro:
        loginUrl: "/passport/login/"
        successUrl: "/"
        unauthorizedUrl: "/error/403"
####################################自定义配置##########################################
