name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

# 同一分支的并发构建只保留最新一次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (JDK 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # 仓库默认 maven.test.skip=true，此步仅编译打包（dev profile）
      - name: Build (package, dev profile)
        run: mvn -B -ntp clean package -Pdev

      # 显式开启测试运行已有单测；无用例或环境敏感时不阻断流水线
      - name: Run tests (soft gate)
        run: mvn -B -ntp test -Dmaven.test.skip=false
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blog-jars
          path: '*/target/*.jar'
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Docker image build (master only)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # 以 prod profile 打包，供镜像使用
      - name: Package (prod profile)
        run: mvn -B -ntp clean package -Pprod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 验证新的多阶段 Dockerfile 可正常构建（不推送）
      - name: Build blog-admin image
        run: docker build -t oneblog/blog-admin:ci ./blog-admin

      - name: Build blog-web image
        run: docker build -t oneblog/blog-web:ci ./blog-web

      - name: Show image sizes
        run: docker images | grep -E 'oneblog/(blog-admin|blog-web)'
