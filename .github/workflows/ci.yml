name: OneBlog CI/CD Pipeline

on:
  push:
    branches: [ master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

env:
  JAVA_VERSION: '8'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository'
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: justauth

jobs:
  # ============== 代码质量检查 ==============
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (dev profile)
        run: mvn clean package -Pdev -B

      - name: Run tests
        run: mvn test -Pdev -B || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: blog-jars
          path: |
            blog-admin/target/blog-admin.jar
            blog-web/target/blog-web.jar
          retention-days: 7

  # ============== Docker 镜像构建 ==============
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push blog-admin
        uses: docker/build-push-action@v4
        with:
          context: .
          file: blog-admin/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/blog-admin:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_USERNAME }}/blog-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push blog-web
        uses: docker/build-push-action@v4
        with:
          context: .
          file: blog-web/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/blog-web:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_USERNAME }}/blog-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============== 发布 Release ==============
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: blog-jars
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/blog-admin/target/blog-admin.jar
            artifacts/blog-web/target/blog-web.jar
          body: |
            ## OneBlog ${{ github.ref_name }}

            ### Docker Images
            - `${{ env.DOCKER_USERNAME }}/blog-admin:${{ github.ref_name }}`
            - `${{ env.DOCKER_USERNAME }}/blog-web:${{ github.ref_name }}`

            ### Changes
            See [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
