# Server settings
server:
    tomcat:
        basedir: /var/tmp/oneblog/blog-web
# SPRING PROFILES
spring:
    profiles:
        include: [center]

# logging settings
logging:
    config: classpath:logback-spring.xml
    file:
      path: /var/tmp/oneblog/logs
    level:
      root: INFO
      com.zyd: INFO

# braum过滤器，用于过滤恶意请求
braum:
  limit:
      access:
          type: redis
          threshold: 30
          interval: 5000

####################################自定义配置##########################################
app:
    # 是否启用kaptcha验证码
    enableKaptcha: ${ONEBLOG_APP_ENABLE_KAPTCHA:false}
    # 测试环境关闭启动时打印数据库连接信息（含密码）
    enabledPrintConfig: ${ONEBLOG_APP_ENABLE_PRINT_CONFIG:false}
####################################自定义配置##########################################
